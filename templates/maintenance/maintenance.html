<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Temporarily Unavailable</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    <style>
        body {
            background-color: #f9fafb;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .maintenance-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="maintenance-container">
        <div class="max-w-md w-full px-4 py-10 bg-white rounded-lg shadow-lg text-center">
            <div class="flex justify-center">
                <svg class="w-24 h-24 text-indigo-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
            </div>

            <h1 class="mt-6 text-3xl font-bold text-gray-800">We'll Be Back Soon</h1>

            <p class="mt-4 text-lg text-gray-600">
                {{ message }}
            </p>

            <p class="mt-3 text-md text-gray-600">
                Please check back shortly. Thank you for your patience.
            </p>
        </div>
    </div>
</body>
</html>
